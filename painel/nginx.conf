map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location /api/coleta/ {
    proxy_pass http://coleta:8000/;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location /api/transporte/ {
    proxy_pass http://transporte:8000/;
    include /etc/nginx/conf.d/proxy.inc;
  }

  location /api/consolidacao/ {
    proxy_pass http://consolidacao:8000/;
    include /etc/nginx/conf.d/proxy.inc;
  }
}
