map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  # Resolve os serviços a cada requisição pelo DNS do Docker: se um container for
  # recriado e mudar de IP, o painel continua apontando para o lugar certo.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  location ~ ^/api/prisma(/.*)$ {
    set $caminho $1;
    proxy_pass http://prisma:8000$caminho$is_args$args;
    include /etc/nginx/conf.d/proxy.inc;
  }
}
